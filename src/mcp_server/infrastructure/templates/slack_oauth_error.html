<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainTrust — Authorization Failed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
  }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 16px;
    padding: 48px; max-width: 480px; width: 90%; text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,.25);
  }
  .icon {
    margin: 0 auto 24px; width: 64px; height: 64px; border-radius: 50%;
    background: rgba(248, 81, 73, .12); border: 2px solid #f85149;
    display: flex; align-items: center; justify-content: center;
  }
  .icon svg { width: 24px; height: 24px; }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; color: #f1f5f9; }
  p { font-size: 16px; line-height: 1.6; color: #94a3b8; }
  .error-detail {
    margin-top: 16px; padding: 12px; background: #27171f; border: 1px solid #5b2138;
    border-radius: 8px; font-size: 14px; color: #fca5a5; word-break: break-word;
  }
  .brand { font-size: 13px; margin-top: 32px; color: #475569; }
</style>
</head>
<body>
<div class="card">
  <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
  <h1>Authorization Failed</h1>
  <p>Something went wrong while connecting your Slack account.</p>
  <div class="error-detail">{{ error }}</div>
  <p class="brand">BrainTrust MCP Server</p>
</div>
</body>
</html>
