[project]
name = "mcp-server"
version = "0.4.0"
description = "MCP server to give functionalities to the agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "httpx2>=2.4.0",
    "jinja2>=3.1.6",
    "jira>=3.10.5",
    "mcp>=1.28.0",
    "py-trello>=0.20.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1",
]

[project.scripts]
mcp-server = "mcp_server.main:main"
mcp-inspector = "mcp_server.dev:main"
mcp-inspector-local = "mcp_server.dev:open_local_inspector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
artifacts = ["src/mcp_server/**/*.html"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.4.0",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
