[project]
name = "mcp-server"
version = "0.2.0"
description = "MCP server to give functionalities to the agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "httpx2>=2.4.0",
    "jira>=3.10.5",
    "mcp>=1.28.0",
    "py-trello>=0.20.1",
]

[project.scripts]
mcp-server = "mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "httpx2>=2.4.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
