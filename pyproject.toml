[project]
name = "mcp-server"
version = "0.4.0"
description = "MCP server to give functionalities to the agent"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "httpx2==2.5.0",
    "jinja2==3.1.6",
    "jira==3.10.5",
    "mcp==1.28.1",
    "py-trello==0.20.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "starlette==1.3.1",
]

[project.scripts]
mcp-server = "mcp_server.main:main"
mcp-inspector = "mcp_server.dev:main"
mcp-inspector-local = "mcp_server.dev:open_local_inspector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
artifacts = ["src/mcp_server/**/*.html"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "anyio>=4.14.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests (isolated, no I/O)",
    "integration: Integration tests (MCP handshake, SSE, DB)",
]

[tool.coverage.run]
source = ["mcp_server"]
omit = [
    "*/dev.py",
    "*/templates/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
